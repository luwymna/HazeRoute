<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>JerebuRoute</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%239c4a1e%22/><text x=%2250%22 y=%2272%22 font-family=%22Arial, sans-serif%22 font-size=%2260%22 font-weight=%22bold%22 fill=%22%23fdfbf6%22 text-anchor=%22middle%22>J</text></svg>">
  <script>
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) { }
  </script>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

  <!-- Full-screen map -->
  <div id="map"></div>

  <div id="minimap" class="minimap"></div>

  <!-- ============================================================
     TOP-CENTER — brand pill
     ============================================================ -->
  <div class="brand-pill glass">
    <span class="brand-dot"></span>
    <span class="brand-name">JerebuRoute</span>

    <button type="button" id="themeBtn" class="theme-btn" aria-label="Change theme" aria-haspopup="true"
      aria-expanded="false" title="Change theme">
      <svg viewBox="0 0 24 24" width="15" height="15">
        <path
          d="M12 3 A9 9 0 1 0 12 21 C13.4 21 14 20 13.4 18.8 C12.8 17.6 13.6 16.5 15 16.5 H17 A4 4 0 0 0 21 12.5 C21 7.3 17 3 12 3Z"
          fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
        <circle cx="7.5" cy="11" r="1.1" fill="currentColor" />
        <circle cx="10.5" cy="7.2" r="1.1" fill="currentColor" />
        <circle cx="15" cy="7.8" r="1.1" fill="currentColor" />
      </svg>
    </button>
    <div id="themeMenu" class="theme-menu" hidden></div>
  </div>

  <div id="uniStrip" class="uni-strip"></div>

  <!-- ============================================================
     TOP-RIGHT — University AQI panel
     ============================================================ -->
  <div class="uni-panel glass">
    <div class="uni-header">
      <span class="uni-title">Campus AQI</span>
      <div class="uni-actions">
        <button id="uniRefreshBtn" class="uni-refresh" title="Refresh">
          <svg viewBox="0 0 24 24" width="14" height="14">
            <path d="M20 11 A8 8 0 1 0 18.5 16" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" />
            <path d="M20 6 V11 H15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </button>
        <button id="uniToggleBtn" class="uni-toggle" type="button" title="Collapse" aria-label="Toggle campus list"
          aria-expanded="true">
          <svg viewBox="0 0 24 24" width="14" height="14">
            <path d="M9 6 L15 12 L9 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </button>
      </div>
    </div>
    <ul id="uniList" class="uni-list">
      <li class="uni-loading">Loading campuses…</li>
    </ul>
  </div>

  <!-- ============================================================
     TOP-LEFT — stacked glass panel
     Contains: inputs, compare button, route cards, samples
     ============================================================ -->

  <div class="panel-stack-left glass" id="mainPanel">
    <button type="button" id="panelToggle" class="panel-toggle-btn" aria-label="Toggle panel" aria-expanded="true">
      <svg viewBox="0 0 24 24" width="16" height="16" class="panel-chevron">
        <path d="M6 9 L12 15 L18 9" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
          stroke-linejoin="round" />
      </svg>
    </button>

    <div class="credit-badge">Built by Luqman Faris · Ahmad Afiq · Haziq Irfan · Jagerdyswarean</div>

    <div id="routeSummary" class="route-summary" hidden>
      <div class="route-summary-text">
        <span class="rs-dot rs-dot-start"></span>
        <span id="rsStart" class="rs-place"></span>
        <span class="rs-arrow">→</span>
        <span class="rs-dot rs-dot-end"></span>
        <span id="rsEnd" class="rs-place"></span>
      </div>
      <button type="button" id="rsEdit" class="rs-edit">Edit</button>
    </div>

    <!-- Routes input group -->
    <div class="routes-panel">
      <div class="input-wrap">
        <span class="input-dot input-dot-start"></span>
        <input id="start" type="text" autocomplete="off" placeholder="Start — place or coordinates" aria-label="Start">
      </div>
      <button type="button" id="swapBtn" class="swap-btn" aria-label="Swap">
        <svg viewBox="0 0 20 20" width="14" height="14">
          <path d="M5 3 L5 15 M5 15 L2 12 M5 15 L8 12 M15 17 L15 5 M15 5 L12 8 M15 5 L18 8" fill="none"
            stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <div class="input-wrap">
        <span class="input-dot input-dot-end"></span>
        <input id="end" type="text" autocomplete="off" placeholder="Destination — place or coordinates"
          aria-label="Destination">
      </div>
    </div>

    <!-- Action row: locate + compare + mode picker -->
    <div class="action-row">
      <button type="button" id="locateBtn" class="btn-icon" aria-label="Use my location" title="Use my location">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path d="M12 2 V5 M12 19 V22 M2 12 H5 M19 12 H22" stroke="currentColor" stroke-width="1.6"
            stroke-linecap="round" />
        </svg>
      </button>

      <button type="button" id="compareBtn" class="btn-primary">
        <span class="btn-text">Compare routes</span>
        <span class="spinner" hidden></span>
      </button>

      <div class="mode-group" role="radiogroup" aria-label="Travel mode">
        <button type="button" class="mode-btn active" data-mode="drive" aria-label="Driving" title="Driving">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path d="M5 11 L6.5 6.2 A2 2 0 0 1 8.4 4.8 H15.6 A2 2 0 0 1 17.5 6.2 L19 11
                   M5 11 H19 M5 11 V17 A1 1 0 0 0 6 18 H7 A1 1 0 0 0 8 17 V16 H16 V17
                   A1 1 0 0 0 17 18 H18 A1 1 0 0 0 19 17 V11" fill="none" stroke="currentColor" stroke-width="1.6"
              stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="7.5" cy="13.5" r="1.1" fill="currentColor" />
            <circle cx="16.5" cy="13.5" r="1.1" fill="currentColor" />
          </svg>
        </button>
        <button type="button" class="mode-btn" data-mode="bike" aria-label="Cycling" title="Cycling">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <circle cx="5.5" cy="17" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6" />
            <circle cx="18.5" cy="17" r="3.2" fill="none" stroke="currentColor" stroke-width="1.6" />
            <path d="M5.5 17 L10 8 L14 8 M10 8 L14.5 17 M18.5 17 L15.5 8 M13 5.5 H16.5" fill="none"
              stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <button type="button" class="mode-btn" data-mode="walk" aria-label="Walking" title="Walking">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <circle cx="12.5" cy="4.5" r="1.7" fill="none" stroke="currentColor" stroke-width="1.6" />
            <path d="M12 8 L10.5 12 L13 14 L12 20 M10.5 12 L8 15 L6 20 M13 14 L16 15 L17 20 M10 9 L7 9 M13 9 L16 10"
              fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
        <!-- Transit mode -->
        <button type="button" class="mode-btn" data-mode="transit" aria-label="Public transit"
          title="Public transit (bus/rail)">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <rect x="4" y="3" width="16" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.6" />
            <path d="M4 10 H20" stroke="currentColor" stroke-width="1.4" />
            <path d="M8 16 L6 20 M16 16 L18 20" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
            <circle cx="8" cy="13" r="1" fill="currentColor" />
            <circle cx="16" cy="13" r="1" fill="currentColor" />
          </svg>
        </button>
      </div>

      <!-- Heatmap toggle -->
      <button type="button" id="heatToggleBtn" class="btn-icon heat-toggle-btn" title="Toggle AQI heatmap"
        aria-label="Toggle heatmap" aria-pressed="true">
        <svg viewBox="0 0 24 24" width="18" height="18">
          <path d="M12 3 C12 3 7 8 7 13 A5 5 0 0 0 17 13 C17 8 12 3 12 3Z" fill="none" stroke="currentColor"
            stroke-width="1.6" stroke-linejoin="round" />
          <path d="M12 13 C12 13 10 11 10 13 A2 2 0 0 0 14 13 C14 11 12 13 12 13Z" fill="currentColor" />
        </svg>
      </button>
    </div>

    <!-- Profile selector -->
    <div class="profile-row">
      <span class="profile-label">Profile</span>
      <div class="profile-group" role="radiogroup" aria-label="Sensitivity profile">
        <button type="button" class="profile-btn active" data-profile="adult">Adult</button>
        <button type="button" class="profile-btn" data-profile="child">Child</button>
        <button type="button" class="profile-btn" data-profile="elderly">Elderly</button>
        <button type="button" class="profile-btn" data-profile="asthma">Asthma</button>
        <button type="button" class="profile-btn" data-profile="pregnant">Pregnant</button>
      </div>
    </div>

    <!-- Sample chips -->
    <div class="samples-row">
      <span class="samples-label">Try</span>
      <button class="chip" data-start="Alor Setar, Kedah" data-end="Sungai Petani, Kedah">Kedah</button>
      <button class="chip" data-start="KLCC, Kuala Lumpur" data-end="Mid Valley, Kuala Lumpur">KL</button>
      <button class="chip" data-start="Johor Bahru, Johor" data-end="Skudai, Johor">Johor</button>
    </div>

    <!-- Empty state (shown before first comparison) -->
    <div id="emptyState" class="empty-state">
      Enter a start and destination, then tap <b>Compare routes</b> to see exposure comparisons.
    </div>

    <!-- Mini-stats row (populated by JS after comparison) -->
    <div id="miniStats" class="mini-stats" hidden></div>

    <!-- Route cards go here -->
    <div id="routeCards" class="route-list"></div>

  </div>

  <!-- Floating error / verdict -->
  <div id="error" class="error-float glass" hidden></div>
  <div id="verdict" class="verdict-float glass" hidden></div>

  <!-- Legend -->
  <div id="legend" class="legend glass" hidden>
    <div><span class="dot dot-winner"></span>Lower exposure</div>
    <div><span class="dot dot-loser"></span>Higher exposure</div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>

</body>

</html>
